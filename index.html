<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To_Do_list</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/src/App.css">
    <link href="https://fonts.googleapis.com/css?family=Kumar+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="heading">
        <h1>MY WORK</h1>
        <span class="subheading">to do list</span>
    </div>
    <div class="add-task">
        <div class="input-labels">
            <label for="task-title">Title:</label>
            <label for="task-desc">Description:</label>
        </div>
        <div class="input-row">
            <input id="task-title" type="text" placeholder="what are you going to do?">
            <input id="task-desc" type="text" placeholder="Description of your To Do">
            <button class="add-btn">Add</button>
        </div>
    </div>
    <div class="type-of-tasks">
        <button id="to-do">To Do</button><button id="completed">Completed</button>
    </div>
    <div class="notebook-container">
        <div class="notebook-table">
            <div class="spiral-inside">
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
            </div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
            <div class="notebook-lines"></div>
        </div>  
    </div> 
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
